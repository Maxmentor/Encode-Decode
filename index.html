<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./content/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <title>Encode-Decode</title>
</head>
<body class="bg-light">

    <!--======================Header================-->
<div class="container bg-success">
    
       <div class="brand">
        <a class="text-light" href=""><h4>Encode-Decode</h4>
   </a></div>

   <div class="links">
    <a class="btn text-light" href="">About</a>
    <a class="btn text-light" href="">Policy</a>
    <a class="btn text-light" href="">Contact</a>
   </div>

</div>

    <!--=======================INPUT=================-->

    <div class="input">
        <input type="text" id="text" placeholder="&nbsp;&nbsp;&nbsp;TYPE YOUR TEXT" /><br><br>
        <a class="btn btn-success" id="encode">Encode</a> &nbsp;&nbsp;&nbsp;<a class="btn btn-success" id="decode">Decode</a>
    </div>


     <!--====================RESULT=================-->


     <div class="result">
        <span>Your Result</span>&nbsp;&nbsp;&nbsp;&nbsp;<a class="btn btn-success"  onclick="copyContent()" id="copy">Copy</a><br>
        <textarea type="text" id="result" placeholder="Your Result Here"> </textarea><br>
         
     </div>

    <!--====================Footer=================-->
<div class="footer class="bg-datk text-light">
Copyright 2022 @ <a href="https://t.me/techmaxpro">TechMaxpro</a>
</div>




    <!--====================END=================-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.1.js" ></script>
    <script>


let copyText = document.querySelector(".result");
copyText.querySelector("#copy").addEventListener("click", function () {
	let input = copyText.querySelector("#result");
	input.select();
	document.execCommand("copy");
	copyText.classList.add("active");
	window.getSelection().removeAllRanges();
	setTimeout(function () {
		copyText.classList.remove("active");
	}, 2500);
});

        $(document).ready(function(){
          $("#encode").click(function(){
            $("#result").html(btoa($("#text").val()));
            $("#text").val("");
          });
        
        });

        $("#decode").click(function(){
            $("#decode").click(function(){
            $("#result").html(atob($("#text").val()));
          

        });
        
    });



        </script>

</body>
</html>
